.addph{width:84px;height:84px;border-radius:16px;border:2px dashed var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);text-align:center;cursor:pointer;flex:none}
.rec{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}

 --bg:#FBF7F2;--card:#FFFFFF;--fg:#2E2622;--muted:#8C7F78;--line:#EFE7E0;--chip:#F3ECE6;--accent:#B87868;--accent-soft:#FCE9E1;--accent-line:#EDA58E;
 --milk:#B45309;--milk-soft:#FEF0C3;--blue:#0B84D0;--poop:#8A4B08;--temp:#F0587A;--green:#0E9F6E;--green-soft:#E3F8EF;--sleep:#4338CA;--warn:#C2113B;
 --c-formula:#F59E0B;--c-breast:#FBD34D;--c-pee:#38BDF8;--c-poop:#A16207;--c-nurse:#F9A8D4;--c-night:#6366F1;--c-day:#C7CCFF;--shadow:none;color-scheme:light}
.pdfroot .card{box-shadow:none;border:1px solid var(--line)}

.linkbtn{color:var(--accent);text-decoration:underline;font-weight:700;padding:8px 4px}

.msg.err{background:#FFE9EE;color:#9B1239}
.msg.ok{background:var(--green-soft);color:var(--green)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- polish layer (additive) ---- */
:root{--r-card:26px;--ease:cubic-bezier(.2,.8,.2,1);
  --ring:0 0 0 1px rgba(120,80,50,.06);--shadow:0 1px 2px rgba(120,80,50,.05),0 8px 24px rgba(120,80,50,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ring:0 0 0 1px rgba(255,255,255,.06);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--ring:0 0 0 1px rgba(255,255,255,.06);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,var(--accent-soft) 0,transparent 60%);background-repeat:no-repeat;background-attachment:fixed;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
.screen.on{animation:ncIn .32s var(--ease) both}
@keyframes ncIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{border-radius:var(--r-card);box-shadow:var(--ring),var(--shadow)}
.card h3{letter-spacing:.04em;font-size:13px}
.big{letter-spacing:-.02em}
.stat .e{top:14px;right:14px;width:34px;height:34px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:17px}
.avatar{background:linear-gradient(145deg,#F7B7A0,#E58F76);box-shadow:0 6px 16px rgba(229,143,118,.35)}
.bell{box-shadow:var(--ring),var(--shadow);transition:transform .15s var(--ease)}
.bell b{box-shadow:0 0 0 2px var(--bg)}
button{transition:transform .15s var(--ease),background-color .15s,box-shadow .15s,border-color .15s,color .15s}
button:active{transform:scale(.96)}
.chip{transition:all .15s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{box-shadow:0 2px 8px rgba(184,120,104,.18)}
.seg{box-shadow:inset 0 1px 2px rgba(120,80,50,.08)}
.seg button.on{box-shadow:0 1px 2px rgba(120,80,50,.12),0 3px 10px rgba(120,80,50,.08)}
.btn{background:linear-gradient(180deg,#C48575,var(--accent));box-shadow:0 4px 12px rgba(184,120,104,.35)}
.btn.soft{background:var(--chip);box-shadow:none}
.field{transition:border-color .15s,box-shadow .15s}
.field:focus-within,.field:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft);outline:0}
.pill{border-radius:16px}
.list>div{padding:13px 0}
.datenav button{border-radius:50%}
.datenav button:not(:disabled):active{background:var(--chip)}
.tabbar{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 -6px 24px rgba(120,80,50,.06)}
.tab{position:relative;transition:color .15s}
.tab.on::after{content:"";position:absolute;bottom:-3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.tab.on svg{transform:translateY(-1px)}
.fab{background:linear-gradient(145deg,#CF9082,var(--accent) 60%,#A8685A);box-shadow:0 10px 24px rgba(184,120,104,.5),0 0 0 6px var(--bg);transition:transform .2s var(--ease)}
.fab:active{transform:scale(.92)}
.toast{background:color-mix(in srgb,var(--fg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(-50%,6px);transition:opacity .2s,transform .25s var(--ease)}
.toast.on{transform:translate(-50%,0)}
.modal{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{box-shadow:0 20px 60px rgba(0,0,0,.25);animation:ncIn .28s var(--ease) both}
.feedcard{box-shadow:var(--shadow)}
.sw{box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.sw::after{box-shadow:0 2px 6px rgba(0,0,0,.25)}
.thumbs button,.thumbs .ph{box-shadow:var(--ring)}
.tag{letter-spacing:.02em}
@media (hover:hover){.chip:hover,.seg button:hover{filter:brightness(.98)}.btn:hover{filter:brightness(1.04)}}

/* ---- luxe layer: champagne / rose-gold ---- */

function bars(opt){ // {labels,series:[{name,color,vals}],stacked,max,ticks,fmt}
  const W=340,H=210,L=34,R=8,T=10,B=26,n=opt.labels.length,iw=W-L-R,ih=H-T-B;
  const y=v=>T+ih-(v/opt.max)*ih; let g='';
  for(let v=0;v<=opt.max;v+=opt.step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11">${v}</text>`}
  const slot=iw/n, ns=opt.stacked?1:opt.series.length, bw=Math.min(26,(slot*.7)/ns);
  opt.labels.forEach((lb,i)=>{
    const cx=L+slot*i+slot/2;
    if(opt.stacked){let acc=0;opt.series.forEach((s,k)=>{const v=s.vals[i];if(!v)return;const y0=y(acc+v),h=y(acc)-y0;g+=`<rect x="${cx-bw/2}" y="${y0}" width="${bw}" height="${h}" fill="${s.color}" rx="${k===opt.series.length-1?4:0}"/>`;acc+=v})}
    else opt.series.forEach((s,k)=>{const v=s.vals[i];const bx=cx-(bw*ns)/2+k*bw;g+=`<rect x="${bx}" y="${y(v)}" width="${bw-2}" height="${y(0)-y(v)}" fill="${s.color}" rx="4"/>`});
    if(n<=8||i%Math.ceil(n/6)===0)g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10.5">${lb}</text>`});
  const lg=opt.series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${opt.title}">${g}</svg><div class="legend">${lg}</div>`;
}
function charts(days){
  const lb=days.map(md), dd=days.map(dayData);

  return {milk:bars({title:'每日奶量',labels:lb,stacked:true,max:top,step:top>800?200:100,series:[{name:'配方奶 (ml)',color:'var(--c-formula)',vals:dd.map(x=>x.f)},{name:'母乳瓶餵 (ml)',color:'var(--c-breast)',vals:dd.map(x=>x.b)}]}),

}

/* ---------- PDF export ---------- */
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector('script[data-lib="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.dataset.lib=src;s.onload=res;s.onerror=()=>rej(new Error('lib'));document.head.appendChild(s)});
let pdfBusy=false;
async function makePdf(nDays){
  if(pdfBusy)return;
  const btn=$('#mkpdf'),label=btn.textContent;
  let downloads=null;
  try{downloads=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(!downloads){toast('這個畫面無法儲存檔案，請用 claude.ai 開啟');return}
  pdfBusy=true;btn.disabled=true;btn.textContent='產生中…';
  let host=null;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    // light-theme offscreen copy of the report so the PDF always prints dark text on white
    host=document.createElement('div');host.className='pdfroot';
    const cards=$$('#s-report > .card').slice(1);
    host.innerHTML=cards.map(c=>'<section class="pdfsec">'+c.outerHTML+'</section>').join('');
    document.body.appendChild(host);
    $$('button',host).forEach(b=>{b.removeAttribute('data-view');b.style.pointerEvents='none'});
    $$('.scroll',host).forEach(s=>s.style.overflow='visible');
    await new Promise(r=>setTimeout(r,150));
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4',orientation:'p'});
    const PW=210,PH=297,M=10,CW=PW-M*2,CH=PH-M*2-6;let y=M,pages=1;
    for(const sec of $$('.pdfsec',host)){
      const cv=await html2canvas(sec,{scale:2,backgroundColor:'#FBF7F2',useCORS:true,logging:false});
      const h=cv.height*CW/cv.width;
      if(h<=CH){
        if(y+h>PH-M-6){pdf.addPage();pages++;y=M}
        pdf.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',M,y,CW,h);y+=h+4;
      }else{ // taller than a page: slice
        if(y>M){pdf.addPage();pages++;y=M}
        const slicePx=Math.floor(CH*cv.width/CW);let off=0;
        while(off<cv.height){
          const sh=Math.min(slicePx,cv.height-off),c2=document.createElement('canvas');c2.width=cv.width;c2.height=sh;
          c2.getContext('2d').drawImage(cv,0,off,cv.width,sh,0,0,cv.width,sh);
          pdf.addImage(c2.toDataURL('image/jpeg',.9),'JPEG',M,M,CW,sh*CW/cv.width);off+=sh;
          if(off<cv.height){pdf.addPage();pages++}
        }
        y=PH;
      }
    }
    const total=pdf.getNumberOfPages();
    for(let i=1;i<=total;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(140,127,120);pdf.text('Baby Growth  '+i+' / '+total,PW/2,PH-6,{align:'center'})}
    const blob=pdf.output('blob');
    const n=new Date(NOW),fname='baby-care-report-'+n.getFullYear()+pad(n.getMonth()+1)+pad(n.getDate())+'-'+nDays+'d.pdf';
    const r=await downloads.save({filename:fname,data:blob});
    toast(r&&r.status==='saved'?'已儲存 PDF':'已送出');
  }catch(err){
    const c=err&&err.code;
    toast(c==='declined'?'已取消儲存':err&&err.message==='lib'?'無法載入 PDF 工具，請確認網路後再試':'產生 PDF 失敗，請再試一次');
  }finally{
    if(host)host.remove();pdfBusy=false;btn.disabled=false;btn.textContent=label;
  }
}

function vacSheet(i,edit){

  const no=$('#vacno');if(no)no.onclick=()=>{delete st.vacc[i];saveCL();m.classList.remove('on');toast('已取消這筆記錄');renderHealth()}}

/* ---------- diaper logging with photos ---------- */
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const M=900,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(file)})}

  ${poop?`<div class="card"><div class="lbl">大便顏色</div><div class="chips">${COLORS.map(([n,c])=>`<button class="chip ${f.color===n?'on':''}" data-c="${n}"><span class="sw-color" style="background:${c};width:16px;height:16px;vertical-align:-3px"></span>${n}</button>`).join('')}</div>

   <p class="sub" style="margin:10px 0 0">${DEMO?'照片只存在這台裝置的瀏覽器裡，不會上傳。':'照片會上傳到雲端，登入同一帳號的家人也看得到。'}</p></div>

  };
}

   ${isT?`<div class="chips" style="margin-bottom:12px">${['耳溫','額溫','腋溫','肛溫'].map(s=>`<button class="chip ${f.site===s?'on':''}" data-site="${s}">${s}</button>`).join('')}</div>
    <div class="stepper"><button class="sb" data-vs="-1" aria-label="降低">−</button><div class="val"><input id="vv" inputmode="decimal" value="${f.v}" aria-label="體溫"><span>°C</span></div><button class="sb" data-vs="1" aria-label="提高">+</button></div>

const BK_KEYS=['nc-feeds','nc-sleeps','nc-pumps','nc-diapers','nc-vitals','nc-baby','nc-vacc','nc-chk','nc-ms','nc-msd'];
function bkBuild(){const d={};BK_KEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)d[k]=JSON.parse(v)}catch(e){}});
  return {app:'nexcare',v:1,at:new Date().toISOString(),baby:st.baby.name||'',data:d}}
function bkCount(b){const g=k=>{const v=b.data&&b.data[k];return Array.isArray(v)?v.length:0};const vi=(b.data&&b.data['nc-vitals'])||{};
  return {餵奶:g('nc-feeds'),睡眠:g('nc-sleeps'),擠奶:g('nc-pumps'),尿布:g('nc-diapers'),體溫:(vi.temps||[]).length,體重:(vi.weights||[]).length}}
async function bkExport(){
  const b=bkBuild(),n=new Date(),name='nexcare-backup-'+n.getFullYear()+pad(n.getMonth()+1)+pad(n.getDate())+'.json';
  const f=new File([JSON.stringify(b)],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'寶寶健康成長 備份'});return true}catch(e){if(e&&e.name==='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}
/* merge: add records that are missing (by id); never overwrite or delete what is already here */
function bkMerge(b){
  let add=0;const d=b.data||{};
  const mergeArr=(inc,cur)=>{if(!Array.isArray(inc))return cur;const ids=new Set(cur.map(r=>r&&r.id));const n=inc.filter(r=>r&&r.id&&!ids.has(r.id));add+=n.length;return n.length?cur.concat(n):cur};
  const mergeObj=(inc,cur)=>{if(!inc||typeof inc!=='object'||Array.isArray(inc))return cur;let o=cur;for(const k of Object.keys(inc)){if(!(k in cur)){if(o===cur)o={...cur};o[k]=inc[k];add++}}return o};
  st.feeds=mergeArr(d['nc-feeds'],st.feeds);st.sleeps=mergeArr(d['nc-sleeps'],st.sleeps);st.pumps=mergeArr(d['nc-pumps'],st.pumps);st.diapers=mergeArr(d['nc-diapers'],st.diapers);
  const vi=d['nc-vitals']||{};st.temps=mergeArr(vi.temps,st.temps);st.weights=mergeArr(vi.weights,st.weights);
  st.vacc=mergeObj(d['nc-vacc'],st.vacc);st.checkup=mergeObj(d['nc-chk'],st.checkup);st.ms=mergeObj(d['nc-ms'],st.ms);st.msDate=mergeObj(d['nc-msd'],st.msDate);
  sv('nc-feeds',st.feeds);sv('nc-sleeps',st.sleeps);sv('nc-pumps',st.pumps);saveD();saveV();saveCL();
  return add}
let bkState=null;   // survives account-card re-renders (sync status changes re-draw the card)
function bkMsgHtml(){
  const S=bkState;if(!S)return '';
  if(S.k==='err')return `<div class="msg err" style="margin-top:10px">${esc(S.t)}</div>`;
  if(S.k==='done')return `<div class="msg ok" style="margin-top:10px">已補回 ${S.n} 筆紀錄，稍後會自動同步到雲端。</div>`;
  const b=S.b,c=bkCount(b),line=Object.keys(c).map(k=>k+' '+c[k]+' 筆').join('、');

function backupHtml(){
  return `<div class="lbl" style="margin:16px 0 8px">資料備份</div>
  <p class="sub" style="margin:0 0 10px">把餵奶、睡眠、擠奶、尿布（含照片）、體溫體重、疫苗健檢紀錄存成一個備份檔，可存到「檔案」或傳給自己。生活貼文的照片影片存在雲端，不在備份檔內。</p>

function bkShow(){const m=$('#bkmsg');if(!m)return;m.innerHTML=bkMsgHtml();bkBindMsg()}
function bkBindMsg(){

  const y=$('#bkyes');if(y)y.onclick=()=>{const n=bkMerge(bkState.b);bkState={k:'done',n};bkShow();try{R[st.tab]&&R[st.tab]()}catch(x){}}}
function bindBackup(){
  const o=$('#bkout');if(!o)return;
  o.onclick=async()=>{o.disabled=true;try{const ok=await bkExport();if(ok)toast('備份檔已產生')}catch(e){toast('匯出失敗：'+(e.message||e))}o.disabled=false};
  $('#bkin').onclick=()=>$('#bkfile').click();

    if(!b||b.app!=='nexcare'||!b.data){bkState={k:'err',t:'這不是本 App 的備份檔。'};bkShow();return}
    bkState={k:'prev',b};bkShow()};
  bkBindMsg()}

/* ---------- live updates (Supabase Realtime) — polling stays as a fallback ---------- */
const RT={ch:null,baby:null,ok:false,t:null};
const RT_TABLES=['feeds','pumps','sleeps','diapers','temps','weights','vaccine_records','checkup_records','milestone_records','supplement_logs'];
function rtStop(){try{if(RT.ch&&sb)sb.removeChannel(RT.ch)}catch(e){}RT.ch=null;RT.baby=null;RT.ok=false}
function rtHit(t){
  clearTimeout(RT.t);
  RT.t=setTimeout(()=>{
    if(!cloud.user||document.hidden)return;
    syncNow()},300)}
function rtStart(){
  if(!sb||!sb.channel||!cloud.user||!cloud.babyId)return;
  if(RT.ch&&RT.baby===cloud.babyId)return;
  rtStop();RT.baby=cloud.babyId;
  try{
    let ch=sb.channel('nc-'+cloud.babyId);
    RT_TABLES.forEach(t=>{ch=ch.on('postgres_changes',{event:'*',schema:'public',table:t,filter:'baby_id=eq.'+cloud.babyId},()=>rtHit(t))});
    ch=ch.on('postgres_changes',{event:'*',schema:'public',table:'babies',filter:'id=eq.'+cloud.babyId},()=>rtHit('babies'));
    ch.subscribe(s=>{RT.ok=(s==='SUBSCRIBED')});
    RT.ch=ch;
  }catch(e){RT.ch=null;RT.baby=null}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!cloud.user)return;
  syncNow();if(RT.baby&&!RT.ok){rtStop();rtStart()}});
window.addEventListener('online',()=>{if(cloud.user){syncNow();rtStop();rtStart()}});


// ---- multi-baby ----
let BSW={list:null};
function switchModal(){let m=$('#bswm');if(!m){m=document.createElement('div');m.className='modal';m.id='bswm';m.innerHTML='<div class="sheet" id="bswb"></div>';document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.classList.remove('on')}}return m}
async function openBabySwitch(){
  if(!cloud.user||!cloud.fam)return;const m=switchModal();m.classList.add('on');
  const b=$('#bswb');b.innerHTML='<b style="font-size:18px">切換寶寶</b><div class="sub">載入中…</div>';
  try{const {data,error}=await sb.from('babies').select('id,name').eq('family_id',cloud.fam).is('deleted_at',null).order('created_at',{ascending:true});if(error)throw error;BSW.list=data}catch(e){b.innerHTML='<b style="font-size:18px">切換寶寶</b><div class="msg err">'+esc(friendly(e))+'</div><button class="btn soft" id="bswx">關閉</button>';$('#bswx').onclick=()=>m.classList.remove('on');return}
  const L=BSW.list;
  b.innerHTML='<b style="font-size:18px">切換寶寶</b>'+L.map(x=>`<button class="btn ${x.id===cloud.babyId?'':'soft'}" data-sb="${x.id}" style="text-align:left;padding:14px 16px">${x.id===cloud.babyId?'✓ ':''}${esc(x.name)}</button>`).join('')
   +(isOwner()?(L.length<MAXB?'<button class="btn soft" id="bswadd">＋ 新增寶寶</button>':'<div class="sub">已達 '+MAXB+' 位上限</div>'):'')
   +'<button class="linkbtn" id="bswx">關閉</button><div id="bswmsg" hidden></div>';
  $('#bswx').onclick=()=>m.classList.remove('on');
  $$('[data-sb]').forEach(x=>x.onclick=()=>x.dataset.sb===cloud.babyId?m.classList.remove('on'):switchBaby(x.dataset.sb));
  const a=$('#bswadd');if(a)a.onclick=()=>addBaby()}
async function safeToLeave(){
  await syncNow();
  if(cloud.status!=='ok'||pending()>0){showMsg('#bswmsg','目前資料還沒同步完成（'+(cloud.err||'請確認網路')+'），請稍後再切換','err');return false}
  return true}
function relink(babyId,flag){
  const keep={uid:cloud.user.id,fam:cloud.fam,role:cloud.role};
  wipeLocal(false);
  try{localStorage.setItem(META,JSON.stringify({...keep,babyId,cur:{},snap:{}}));localStorage.removeItem(JK);if(flag)localStorage.setItem('nc-newbaby',flag)}catch(e){}
  location.reload()}
async function switchBaby(id){
  $$('[data-sb],#bswadd').forEach(x=>x.disabled=true);
  if(!await safeToLeave()){$$('[data-sb],#bswadd').forEach(x=>x.disabled=false);return}
  relink(id)}
async function addBaby(){
  if(!isOwner())return;
  if(!confirm('要新增另一位寶寶嗎？目前的寶寶資料會先上傳保留。'))return;
  $$('[data-sb],#bswadd').forEach(x=>x.disabled=true);
  if(!await safeToLeave()){$$('[data-sb],#bswadd').forEach(x=>x.disabled=false);return}
  relink(null,cloud.babyId)}
function cancelNewBaby(){const prev=newBabyFlag();relink(prev&&prev!=='1'?prev:null)}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#bsw'))openBabySwitch()});

// ---- push page ----
function pushStatus(){if(!VAPID_PUB||VAPID_PUB.indexOf('__')===0||!pushOk())return '這台裝置尚未支援';return PUSH.sub?'已開啟':'未開啟'}
function renderPush(){
  const own=isOwner();
  $('#s-push').innerHTML=`<div class="hdr"><button class="linkbtn" id="pback" style="font-size:20px">‹ 設定</button><h1 style="flex:1;text-align:center;margin:0">推播提醒</h1><span style="width:56px"></span></div>
  <div class="card">${pushHtml()}</div>
  ${own?`<div class="sec">提醒時間</div><div class="card">${remindHtml()}</div>`:''}`;
  $('#pback').onclick=()=>go('settings');
  bindPush();if(own)bindRemind()}
R.push=renderPush;
// ---- baby avatar ----
function avatarPick(){
  if(!isOwner()){toast('只有主帳號可以更換寶寶照片');return}
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{const S=192,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
      const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;x.drawImage(img,sx,sy,m,m,0,0,S,S);URL.revokeObjectURL(u);
      st.baby.avatar=c.toDataURL('image/jpeg',.82);saveBaby();toast('已更新寶寶照片');if(st.cur==='home')R.home()};
    img.onerror=()=>{URL.revokeObjectURL(u);toast('這張照片無法讀取')};img.src=u};
  if(st.baby.avatar&&confirm('要更換照片嗎？\n（按「取消」可以選擇移除照片）')){inp.click();return}
  if(st.baby.avatar){if(confirm('移除寶寶照片？')){st.baby.avatar='';saveBaby();if(st.cur==='home')R.home()}return}
  inp.click()}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#avpick'))avatarPick()});

boot();

})();
</script>
